name: Build QMK Firmware

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install QMK CLI Toolchain
      run: |
        python3 -m pip install --upgrade pip
        python3 -m pip install qmk

    - name: Clone QMK Library and Inject Files
      run: |
        # 1. Grab the official foundational framework
        git clone --depth=1 https://github.com
        
        # 2. Extract your custom keyboard name dynamically from your Firmware folder
        KB_NAME=$(python3 -c "import json; print(json.load(open('./Firmware/info.json'))['keyboard_name'])")
        KB_FOLDER=$(echo "$KB_NAME" | tr '[:upper:]' '[:lower:]' | tr -d ' ')
        
        # 3. Create the required path layout inside the cloned firmware repository
        TARGET_DIR="./qmk_firmware/keyboards/$KB_FOLDER"
        mkdir -p "$TARGET_DIR/keymaps/default"
        
        # 4. Safely move your project files into QMK's tracking folders
        cp ./Firmware/info.json "$TARGET_DIR/info.json"
        cp ./Firmware/keymap.c "$TARGET_DIR/keymaps/default/keymap.c"
        
        # 5. Move inside the core framework and prepare the environment dependencies
        cd qmk_firmware
        qmk setup -y
        
        # 6. Build your keyboard using your specific keymap
        qmk compile -kb "$KB_FOLDER" -km default
        
        # 7. Relocate your compiled flashing binaries back to the root folder
        mv *.hex *.bin *.uf2 .. 2>/dev/null || true

    - name: Upload compiled binary
      uses: actions/upload-artifact@v4
      with:
        name: keyboard-firmware
        path: |
          *.hex
          *.bin
          *.uf2
