name: Build QMK Firmware

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Compile QMK Firmware
      uses: qmk/qmk-compile-action@v1
      with:
        info_json_path: './Files/info.json'
        keymap_c_path: './Files/keymap.c'

    - name: Upload compiled binary
      uses: actions/upload-artifact@v4
      with:
        name: keyboard-firmware
        path: |
          *.hex
          *.bin
          *.uf2
